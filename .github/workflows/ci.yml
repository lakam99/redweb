name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18/20 retain legacy compatibility checks; they are end-of-life upstream.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --silent
      - run: npm run verify:load
      - name: Server recovery acceptance (server-steady-v1)
        run: npm run verify:recovery:server -- "$GITHUB_WORKSPACE/coverage/server-recovery"
        shell: bash
        id: recovery
        timeout-minutes: 2
      - run: npm audit --omit=dev
      - name: Original shared-process recovery (non-blocking diagnostic)
        # A failed/timed-out owner may have uncertain worker cleanup. Do not
        # start another measurement unless the server gate confirmed cleanup.
        if: ${{ !cancelled() && steps.recovery.outcome == 'success' }}
        id: recovery-original
        continue-on-error: true
        timeout-minutes: 2
        # Explicit bash retains pipefail: tee must not turn a failed check green.
        shell: bash
        run: npm run verify:recovery 2>&1 | tee coverage/recovery-original.log
      - name: Recovery outcome summary
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        shell: bash
        env:
          SERVER_OUTCOME: ${{ steps.recovery.outcome }}
          ORIGINAL_OUTCOME: ${{ steps.recovery-original.outcome }}
        run: |
          printf '## Recovery verification\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Server-only acceptance (blocking): **%s**\n\n' "$SERVER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'Original shared-process diagnostic (non-blocking): **%s**\n\n' "$ORIGINAL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'The original diagnostic retains its exit status and logs. A server pass does not resolve historical shared-process failures.\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$ORIGINAL_OUTCOME" != success ]; then
            echo '::warning::Original shared-process recovery did not pass; inspect its step outcome and any available log (skipped steps have no log). This diagnostic is non-blocking by maintainer decision.'
          fi
      - name: Preserve recovery evidence on success or failure
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.node }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/server-recovery/
            coverage/recovery-original.log
          if-no-files-found: error
          retention-days: 30

  lifecycle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:recovery:coverage
        timeout-minutes: 3
      - run: npm run verify:assets:coverage
        timeout-minutes: 1
      - run: npm run verify:room:coverage
        timeout-minutes: 3
      - run: npm run verify:action:coverage
        id: action-verifier-coverage
        timeout-minutes: 45
      - name: Preserve action-input verifier coverage evidence
        if: ${{ always() && steps.action-verifier-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: action-verifier-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/action-verifier/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:build:coverage
        id: build-coverage
        timeout-minutes: 20
      - name: Preserve generator coverage evidence
        if: ${{ always() && steps.build-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: generator-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/tool-source/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:recorder:coverage
        id: recorder-coverage
        timeout-minutes: 5
      - name: Preserve application-recorder coverage evidence
        if: ${{ always() && steps.recorder-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: recorder-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/application-recorder-authored/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:memory:coverage
        id: memory-coverage
        timeout-minutes: 20
      - name: Preserve memory coverage evidence
        if: ${{ always() && steps.memory-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/memory-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:memory
        timeout-minutes: 7
      - run: npm run verify:load:coverage
        id: load-coverage
        timeout-minutes: 12
      - name: Preserve load coverage evidence
        if: ${{ always() && steps.load-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: load-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/load-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:cli
        timeout-minutes: 5
      - run: npm run verify:overhead:coverage
        id: benchmark-coverage
        timeout-minutes: 35
      - name: Preserve benchmark coverage evidence
        if: ${{ always() && steps.benchmark-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/benchmark-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:recovery:diagnostics
        timeout-minutes: 2
      - run: npm run verify:starters:lifecycle
        timeout-minutes: 5
      - run: npm run verify:live-html:browser
      - run: npm run verify:browser:coverage
        timeout-minutes: 5
      - run: npm run verify:development:browser
        timeout-minutes: 10
      - run: npm run verify:live-html:load
        timeout-minutes: 4
      - run: npm run verify:live-html:load:coverage
        id: html-load-coverage
        timeout-minutes: 20
      - name: Preserve HTML load coverage evidence
        if: ${{ always() && steps.html-load-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: html-load-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/live-html-load-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:jsx:performance
        timeout-minutes: 2
      - run: npm run verify:jsx:coverage
        id: jsx-coverage
        timeout-minutes: 3
      - name: Preserve JSX verifier coverage evidence
        if: ${{ always() && steps.jsx-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: jsx-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/jsx-performance-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:package:examples:coverage
        id: example-dependency-coverage
        timeout-minutes: 30
      - name: Preserve packaged-example verifier coverage evidence
        if: ${{ always() && steps.example-dependency-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: example-dependency-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/example-dependency-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:live-html:package
        id: packed-browser
      - name: Preserve packed browser evidence
        if: ${{ always() && steps.packed-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: packed-browser-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/packed-browser/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:soak:coverage
        id: soak-coverage
        timeout-minutes: 20
      - name: Preserve soak verifier coverage evidence
        if: ${{ always() && steps.soak-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: soak-coverage-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/soak-tools/
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:soak
        timeout-minutes: 2
        env:
          REDWEB_SOAK_SECONDS: 30
          REDWEB_SOAK_CLIENTS: 16
