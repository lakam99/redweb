name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recovery-extension-diagnostic:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 16 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Five fixed Node 22 storms (diagnostic only)
        env:
          REDWEB_RECOVERY_PROTOCOL: steady-v2
          REDWEB_RECOVERY_STORM_ROUNDS: '5'
        run: |
          node -p 'JSON.stringify({node: process.version, v8: process.versions.v8})'
          git rev-parse HEAD
          test "$(git rev-parse HEAD:src)" = 3750418373f591bebe6fdd9e6d71ad88831cc03d
          test "$(git rev-parse HEAD:index.js)" = 9a0fbf919463b74c4eafb164e9b21a903d75e76d
          test "$(git rev-parse HEAD:package-lock.json)" = 1c1cee59e4a6ef709b5cea457cb934bde2bf3f72
          node --expose-gc scripts/verify-recovery.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18/20 retain legacy compatibility checks; they are end-of-life upstream.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --silent
      - run: npm run verify:load
      - run: npm run verify:recovery
        id: recovery
      - name: Diagnose Node 20 recovery failure (not acceptance)
        if: ${{ failure() && matrix.node == 20 && steps.recovery.outcome == 'failure' && github.event_name == 'pull_request' }}
        timeout-minutes: 2
        run: |
          node -p 'JSON.stringify({node: process.version, v8: process.versions.v8})'
          git rev-parse HEAD
          set +e
          node --expose-gc --trace-gc-nvp --trace-opt --trace-deopt scripts/verify-recovery.js
          diagnostic_status=$?
          echo "Diagnostic exit status: $diagnostic_status (the original recovery failure remains a failed gate)"
          exit "$diagnostic_status"
      - run: npm audit --omit=dev

  lifecycle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:memory
      - run: npm run verify:cli
        timeout-minutes: 5
      - run: npm run verify:starters:lifecycle
        timeout-minutes: 5
      - run: npm run verify:live-html:browser
      - run: npm run verify:browser:coverage
        timeout-minutes: 5
      - run: npm run verify:development:browser
        timeout-minutes: 10
      - run: npm run verify:live-html:load
      - run: npm run verify:jsx:performance
      - run: npm run verify:live-html:package
      - run: npm run verify:soak
        env:
          REDWEB_SOAK_SECONDS: 30
          REDWEB_SOAK_CLIENTS: 16
