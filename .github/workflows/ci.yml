name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18/20 retain legacy compatibility checks; they are end-of-life upstream.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --silent
      - run: npm run verify:load
      - name: Server recovery acceptance (server-steady-v1)
        run: npm run verify:recovery:server -- "$GITHUB_WORKSPACE/coverage/server-recovery"
        shell: bash
        id: recovery
        timeout-minutes: 2
      - run: npm audit --omit=dev
      - name: Original shared-process recovery (non-blocking diagnostic)
        # A failed/timed-out owner may have uncertain worker cleanup. Do not
        # start another measurement unless the server gate confirmed cleanup.
        if: ${{ !cancelled() && steps.recovery.outcome == 'success' }}
        id: recovery-original
        continue-on-error: true
        timeout-minutes: 2
        # Explicit bash retains pipefail: tee must not turn a failed check green.
        shell: bash
        run: npm run verify:recovery 2>&1 | tee coverage/recovery-original.log
      - name: Recovery outcome summary
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        shell: bash
        env:
          SERVER_OUTCOME: ${{ steps.recovery.outcome }}
          ORIGINAL_OUTCOME: ${{ steps.recovery-original.outcome }}
        run: |
          printf '## Recovery verification\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Server-only acceptance (blocking): **%s**\n\n' "$SERVER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'Original shared-process diagnostic (non-blocking): **%s**\n\n' "$ORIGINAL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'The original diagnostic retains its exit status and logs. A server pass does not resolve historical shared-process failures.\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$ORIGINAL_OUTCOME" != success ]; then
            echo '::warning::Original shared-process recovery did not pass; inspect its step outcome and any available log (skipped steps have no log). This diagnostic is non-blocking by maintainer decision.'
          fi
      - name: Preserve recovery evidence on success or failure
        if: ${{ always() && steps.recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.node }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/server-recovery/
            coverage/recovery-original.log
          if-no-files-found: error
          retention-days: 30

  lifecycle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:memory
      - run: npm run verify:cli
        timeout-minutes: 5
      - run: npm run verify:recovery:diagnostics
        timeout-minutes: 2
      - run: npm run verify:starters:lifecycle
        timeout-minutes: 5
      - run: npm run verify:live-html:browser
      - run: npm run verify:browser:coverage
        timeout-minutes: 5
      - run: npm run verify:development:browser
        timeout-minutes: 10
      - run: npm run verify:live-html:load
      - run: npm run verify:jsx:performance
      - run: npm run verify:live-html:package
      - run: npm run verify:soak
        env:
          REDWEB_SOAK_SECONDS: 30
          REDWEB_SOAK_CLIENTS: 16
